<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline &mdash; HEXA STOK</title>
<style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        background: #14243B; color: #E7EEF8; padding: 24px;
    }
    .box { max-width: 380px; text-align: center; }
    img { width: 76px; height: 76px; margin-bottom: 18px; border-radius: 16px; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #A9BBD6; font-size: .92rem; line-height: 1.5; }
    button {
        appearance: none; border: 0; cursor: pointer;
        background: #2A5298; color: #fff; font-weight: 600;
        padding: 12px 22px; border-radius: 10px; font-size: .95rem;
    }
    button:active { background: #1E3C72; }
</style>
</head>
<body>
    <div class="box">
        <img src="./assets/img/pwa/icon-192.png" alt="">
        <h1>Tidak ada koneksi</h1>
        <p>Aplikasi butuh internet untuk menampilkan data terbaru. Periksa koneksi Anda lalu coba lagi.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
